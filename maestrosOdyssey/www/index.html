<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Maestro’s Odyssey</title>
  <style>
    :root {
      --bg: #121018;
      --panel: #1c1828;
      --gold: #d4af6a;
      --text: #eae6f0;
      --dim: #7a7388;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: linear-gradient(160deg, #1a1530 0%, var(--bg) 45%);
      color: var(--text);
      font-family: "Georgia", "Palatino", serif;
      line-height: 1.55;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    header {
      width: 100%;
      padding: 1.25rem clamp(1rem, 4vw, 2.5rem);
      border-bottom: 1px solid rgba(212, 175, 106, 0.2);
      text-align: center;
    }
    header h1 {
      font-size: clamp(1.4rem, 3vw, 2rem);
      font-weight: 400;
      margin: 0 0 0.35rem;
      color: var(--gold);
    }
    header p {
      margin: 0 auto;
      color: var(--dim);
      font-size: 0.95rem;
      max-width: 52ch;
    }
    main {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem 1rem 2rem;
      width: 100%;
    }
    .game-shell {
      background: var(--panel);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 12px;
      padding: 0.75rem;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.35);
    }
    #game canvas {
      display: block;
      border-radius: 6px;
    }
    #hint {
      margin-top: 0.85rem;
      color: var(--dim);
      font-family: system-ui, sans-serif;
      font-size: 0.82rem;
      letter-spacing: 0.04em;
      text-align: center;
    }
  </style>
</head>
<body>
  <header>
    <h1>Maestro’s Odyssey</h1>
    <p>Walk the border village, meet neighbors, and listen for the stories between languages.</p>
  </header>
  <main>
    <div class="game-shell">
      <div id="game"></div>
    </div>
    <p id="hint">Arrow keys / WASD to move · Space to interact</p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/phaser@3.60.0/dist/phaser.min.js"></script>
  <script src="mo-farm-rpg.js"></script>
</body>
</html>
