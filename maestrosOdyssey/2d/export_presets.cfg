html/custom_html_shell=""
html/head_include="<style>html,body{margin:0;height:100%;background:#5a4038;overflow:hidden}#canvas{width:100% !important;height:100% !important;object-fit:contain;image-rendering:pixelated}#mo-day-skip{display:none;position:fixed;top:8px;right:8px;z-index:50;width:210px;text-align:right}#mo-day-skip button{font:12px sans-serif;margin:0 0 4px 4px;padding:4px 8px;background:#f4ead8;color:#2a1c14;border:1px solid #8a6a3a;cursor:pointer}</style><script>window.MO_SKIP_DAY=0;document.addEventListener('DOMContentLoaded',function(){var box=document.createElement('div');box.id='mo-day-skip';var html='';for(var day=2;day<=8;day++){html+='<button type=button data-day='+day+'>Day '+day+'</button>';if(day===5)html+='<br>';}box.innerHTML=html;box.addEventListener('click',function(ev){var b=ev.target;if(b&&b.getAttribute){var n=Number(b.getAttribute('data-day'));if(n>=2)window.MO_SKIP_DAY=n;}});document.body.appendChild(box);fetch('/hub/api/auth/me',{credentials:'include',cache:'no-store'}).then(function(r){return r.json()}).then(function(d){var email=String((d&&d.email)||'').toLowerCase();if(d&&d.signedIn&&d.isOwner&&email==='nightofhonour@gmail.com')box.style.display='block';}).catch(function(){});});</script>"
