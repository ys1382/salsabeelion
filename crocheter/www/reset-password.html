<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Reset password — Cozy Crocheter</title>
  <link rel="stylesheet" href="./crocheter-shared.css?v=account-1" />
  <style>
    .account-wrap { max-width: 28rem; margin: 0 auto; padding: clamp(1.25rem, 4vw, 2.5rem); }
    .account-wrap h1 { font-size: 1.75rem; font-weight: 500; margin: 0 0 0.35rem; }
    .account-lead { color: var(--soft); margin: 0 0 1.25rem; font-size: 0.98rem; }
    .account-panel label { display: block; font-family: system-ui, sans-serif; font-size: 0.85rem; margin: 0.75rem 0 0.3rem; color: var(--soft); }
    .account-panel input { width: 100%; padding: 0.55rem 0.65rem; border-radius: 8px; border: 1px solid var(--line); background: var(--cream); color: var(--ink); font-size: 1rem; }
    .account-panel button { margin-top: 1rem; width: 100%; padding: 0.65rem 1rem; border-radius: 10px; border: 1px solid var(--line); background: rgba(107, 143, 113, 0.15); color: var(--accent); font-size: 1rem; cursor: pointer; font-weight: 600; }
    .auth-error, .auth-ok { font-family: system-ui, sans-serif; font-size: 0.88rem; margin: 0.75rem 0 0; }
    .auth-error { color: #a05252; }
    .auth-ok { color: var(--soft); }
    .success-panel {
      background: rgba(107, 143, 113, 0.12);
      border: 1px solid var(--line);
      border-radius: 14px;
      padding: 1.1rem 1.25rem;
      margin-top: 1rem;
      font-family: system-ui, sans-serif;
      font-size: 0.95rem;
    }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <div class="account-wrap">
    <p class="header-nav"><a href="./account.html">← Back to sign in</a></p>
    <h1>Reset password</h1>
    <p class="account-lead" id="leadText">We’ll email a one-hour link to the address you signed up with.</p>

    <div class="account-panel" id="requestPanel">
      <form id="requestForm">
        <label for="resetEmail">Email</label>
        <input type="email" id="resetEmail" autocomplete="username" required />
        <button type="submit">Send reset link</button>
      </form>
    </div>

    <div class="account-panel" id="choosePanel" hidden>
      <form id="chooseForm">
        <label for="newPassword">New password (8+ characters)</label>
        <input type="password" id="newPassword" autocomplete="new-password" required minlength="8" />
        <label for="confirmPassword">Confirm new password</label>
        <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="8" />
        <button type="submit">Save new password</button>
      </form>
    </div>

    <p class="auth-error" id="statusMsg" hidden></p>
    <div class="success-panel account-panel" id="successPanel" hidden>
      <p><strong>Check your email.</strong> If that address has an account, we sent a one-hour reset link there.</p>
      <p style="margin:0.65rem 0 0;color:var(--soft);font-size:0.88rem">The link does <strong>not</strong> appear on this page — open your inbox (and junk folder).</p>
      <p style="margin:0.65rem 0 0"><a href="./account.html">Back to sign in</a></p>
    </div>
  </div>
  <script src="./crocheter-api-config.js"></script>
  <script src="./crocheter-account-storage.js?v=account-1"></script>
  <script src="./crocheter-auth.js"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var token = params.get("token") || "";
      var returnUrl = params.get("return") || "./index.html";
      var statusEl = document.getElementById("statusMsg");
      var requestPanel = document.getElementById("requestPanel");
      var choosePanel = document.getElementById("choosePanel");

      var successPanel = document.getElementById("successPanel");

      function setStatus(msg, ok) {
        statusEl.textContent = msg || "";
        statusEl.hidden = !msg;
        statusEl.className = ok ? "auth-ok" : "auth-error";
      }

      if (token) {
        requestPanel.hidden = true;
        choosePanel.hidden = false;
        document.getElementById("leadText").textContent = "Choose a new password for your account.";
      }

      document.getElementById("requestForm").addEventListener("submit", function (e) {
        e.preventDefault();
        setStatus("");
        successPanel.hidden = true;
        var btn = e.target.querySelector("button[type=submit]");
        if (btn) btn.disabled = true;
        CrocheterAuth.requestPasswordReset(document.getElementById("resetEmail").value.trim()).then(function (res) {
          if (btn) btn.disabled = false;
          if (res && res.ok) {
            requestPanel.hidden = true;
            successPanel.hidden = false;
            document.getElementById("leadText").textContent = "Email sent (if that account exists).";
            return;
          }
          setStatus(CrocheterAuth.friendlyError(res && res.error), false);
        }).catch(function () {
          if (btn) btn.disabled = false;
          setStatus("Couldn’t reach the site right now. Try again in a moment.", false);
        });
      });

      document.getElementById("chooseForm").addEventListener("submit", function (e) {
        e.preventDefault();
        setStatus("");
        var p1 = document.getElementById("newPassword").value;
        var p2 = document.getElementById("confirmPassword").value;
        if (p1 !== p2) {
          setStatus("Passwords don’t match.", false);
          return;
        }
        CrocheterAuth.completePasswordReset(token, p1).then(function (res) {
          if (res && res.ok) return CrocheterAuth.afterAuthSuccess(returnUrl);
          setStatus(CrocheterAuth.friendlyError(res && res.error), false);
        });
      });
    })();
  </script>
</body>
</html>
