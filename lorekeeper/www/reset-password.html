<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, minimum-scale=1" />
  <title>Reset password — LoreKeeper</title>
  <link rel="stylesheet" href="./lk-shared.css?v=8" />
</head>
<body>
  <div class="lk-wrap" style="max-width:28rem">
    <p class="header-nav"><a href="./account.html">← Back to sign in</a></p>
    <h1>Reset password</h1>
    <p class="lk-lead" id="leadText">We’ll email a one-hour link to the address you signed up with.</p>

    <div class="lk-panel" id="requestPanel">
      <form id="requestForm" novalidate>
        <div class="lk-field">
          <label for="resetEmail">Email</label>
          <input type="email" id="resetEmail" autocomplete="username" required />
        </div>
        <button type="submit" class="lk-btn">Send reset link</button>
      </form>
    </div>

    <div class="lk-panel" id="choosePanel" hidden>
      <form id="chooseForm" novalidate>
        <div class="lk-field">
          <label for="newPassword">New password (8+ characters)</label>
          <input type="password" id="newPassword" autocomplete="new-password" required minlength="8" />
        </div>
        <div class="lk-field">
          <label for="confirmPassword">Confirm new password</label>
          <input type="password" id="confirmPassword" autocomplete="new-password" required minlength="8" />
        </div>
        <button type="submit" class="lk-btn">Save new password</button>
      </form>
    </div>

    <p class="lk-status" id="statusMsg" role="alert"></p>
    <div class="lk-panel" id="successPanel" hidden>
      <p><strong>Check your email.</strong> If that address has a LoreKeeper account, we sent a one-hour reset link there.</p>
      <p class="muted" style="margin:0.65rem 0 0;font-size:0.88rem">The link does <strong>not</strong> appear on this page — open your inbox (and junk folder).</p>
      <p style="margin:0.65rem 0 0"><a href="./account.html">Back to sign in</a></p>
    </div>
  </div>
  <script src="./lk-api-config.js?v=3"></script>
  <script src="./lk-account-storage.js?v=8"></script>
  <script src="./lk-auth.js?v=6"></script>
  <script>
    (function () {
      var params = new URLSearchParams(location.search);
      var token = params.get("token") || "";
      var returnUrl = params.get("return") || "./index.html";
      var statusEl = document.getElementById("statusMsg");
      var requestPanel = document.getElementById("requestPanel");
      var choosePanel = document.getElementById("choosePanel");

      var successPanel = document.getElementById("successPanel");

      function setStatus(msg) {
        statusEl.textContent = msg || "";
      }

      if (token) {
        requestPanel.hidden = true;
        choosePanel.hidden = false;
        document.getElementById("leadText").textContent = "Choose a new password for your LoreKeeper account.";
      }

      document.getElementById("requestForm").addEventListener("submit", function (e) {
        e.preventDefault();
        setStatus("");
        successPanel.hidden = true;
        var btn = e.target.querySelector("button[type=submit]");
        if (btn) btn.disabled = true;
        LoreKeeperAuth.requestPasswordReset(document.getElementById("resetEmail").value.trim()).then(function (res) {
          if (btn) btn.disabled = false;
          if (res && res.ok) {
            requestPanel.hidden = true;
            successPanel.hidden = false;
            document.getElementById("leadText").textContent = "Email sent (if that account exists).";
            return;
          }
          setStatus(LoreKeeperAuth.friendlyError(res && res.error));
        }).catch(function () {
          if (btn) btn.disabled = false;
          setStatus("Couldn’t reach LoreKeeper right now. Try again in a moment.");
        });
      });

      document.getElementById("chooseForm").addEventListener("submit", function (e) {
        e.preventDefault();
        setStatus("");
        var p1 = document.getElementById("newPassword").value;
        var p2 = document.getElementById("confirmPassword").value;
        if (p1 !== p2) {
          setStatus("Passwords don’t match.");
          return;
        }
        LoreKeeperAuth.completePasswordReset(token, p1).then(function (res) {
          if (res && res.ok) return LoreKeeperAuth.afterAuthSuccess(returnUrl);
          setStatus(LoreKeeperAuth.friendlyError(res && res.error));
        });
      });
    })();
  </script>
</body>
</html>
