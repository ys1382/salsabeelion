  <style>
    :root {

      font-family: "Georgia", "Palatino", serif;

    }
    .wrap {
      max-width: 640px;
      margin: 0 auto;
      padding: 1.25rem clamp(1rem, 4vw, 2rem) 3rem;
    }
    nav.top {
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: 0.85rem;
      margin-bottom: 1rem;
    }
    nav.top a { color: var(--accent); }
    .scene-label {
      font-family: system-ui, sans-serif;
      font-size: 0.72rem;

    .scene-visual {
      margin: 0 auto 1rem;
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(227, 184, 106, 0.2);
      background: rgba(0,0,0,0.35);
      aspect-ratio: 16 / 9;
      max-height: min(52vh, 440px);
      /* When max-height caps the frame, also cap width so the box stays true 16:9 (avoids horizontal squash/stretch). */
      width: min(100%, calc((16 / 9) * min(52vh, 440px)));
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }
    .scene-visual img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center center;
    }
    .scene-visual.scene-visual--empty {
      display: none;
    }
    .choices {
      display: flex;
      flex-direction: column;
      gap: 0.55rem;
      margin-top: 1.1rem;
    }
    button.choice {
      font-family: system-ui, "Segoe UI", sans-serif;
      text-align: left;
      padding: 0.65rem 0.85rem;
      border-radius: 10px;
      border: 1px solid var(--rule);
      background: rgba(227, 184, 106, 0.08);
      color: var(--ink);

      font-size: 0.92rem;
      line-height: 1.45;
      transition: background 0.15s, border-color 0.15s;
    }
    @media (hover: hover) and (pointer: fine) {
      button.choice:hover {
        background: rgba(227, 184, 106, 0.16);
        border-color: rgba(227, 184, 106, 0.45);
      }
    }
    .end-book {
      font-size: 1.05rem;
      color: var(--accent);
      margin: 0.5rem 0 0;
    }
    .muted { color: var(--dim); font-size: 0.95rem; }
    .restart {
      margin-top: 1rem;
      font-family: system-ui, sans-serif;
      font-size: 0.88rem;
    }
    .restart button {
      background: transparent;
      border: none;
      color: var(--accent);
      cursor: pointer;
      text-decoration: underline;
      padding: 0;
      font: inherit;
    }
    .restart button:disabled {
      color: var(--dim);
      cursor: not-allowed;
      text-decoration: none;
    }
    .review-block {
      margin-top: 1.25rem;
      padding-top: 1.1rem;
      border-top: 1px solid var(--rule);
    }
    .review-block h2 {
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: 0.82rem;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--accent-soft);
      margin: 0 0 0.5rem;
    }
    .review-block p.hint { font-size: 0.92rem; color: var(--dim); margin: 0 0 0.75rem; }
    .review-options {
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      margin: 0.5rem 0 0.75rem;
    }
    .review-options label {
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: 0.9rem;
      cursor: pointer;
      display: flex;
      align-items: flex-start;

      line-height: 1.4;
    }
    .review-options input { margin-top: 0.2rem; }
    .aspect-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 0.45rem;

    }
    .aspect-grid label {
      font-family: system-ui, "Segoe UI", sans-serif;

    }
    .aspect-grid input { margin: 0; }
    textarea.review-note {
      width: 100%;

      color: var(--accent-soft);

    }
    .review-finished-row .finished-toggle button[aria-pressed="true"] {
      background: rgba(227, 184, 106, 0.18);
      color: var(--ink);
      border-color: rgba(227, 184, 106, 0.5);
    }
    .review-finished-row .muted {
      flex: 1 1 100%;
      color: var(--dim);
      font-size: 0.78rem;
      margin: 0;
    }
    button.review-submit {
      font-family: system-ui, "Segoe UI", sans-serif;
      padding: 0.55rem 1rem;
      border-radius: 10px;
      border: 1px solid rgba(227, 184, 106, 0.5);
      background: rgba(227, 184, 106, 0.2);
      color: var(--ink);
      cursor: pointer;
      font-size: 0.9rem;
    }
    @media (hover: hover) and (pointer: fine) {
      button.review-submit:hover {
        background: rgba(227, 184, 106, 0.3);
      }
    }
    .gate-banner {
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: 0.88rem;
      color: var(--dim);
      margin-bottom: 0.75rem;
      padding: 0.65rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--rule);
      background: rgba(227, 184, 106, 0.06);
    }
    .halalit-occasion-banner {
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: clamp(0.92rem, 2.2vw, 1.05rem);
      text-align: center;
      padding: 0.7rem clamp(1rem, 4vw, 2rem);
      margin: 0;
      border-bottom: 1px solid var(--rule);
      background: linear-gradient(180deg, rgba(227, 184, 106, 0.18), rgba(227, 184, 106, 0.08));

      gap: 0.3rem;

    }
    .halalit-occasion-banner__title {
      font-weight: 600;
    }
    .halalit-occasion-banner__which {

      font-size: 0.82em;

    }
    .review-target-block {
      margin: 0.75rem 0 1rem;
      padding: 0.75rem 0.85rem;

      border: 1px solid var(--rule);

    }
    .review-target-block > p.lead {
      font-family: system-ui, "Segoe UI", sans-serif;

    .review-target-options label { margin-bottom: 0.35rem; }
    .own-book-panel {

      border-top: 1px solid rgba(227, 184, 106, 0.15);

    .own-book-panel.is-open { display: block; }
    .own-book-panel label.field {

      font-size: 0.85rem;

    .own-book-panel input[type="text"] {

      margin-bottom: 0.65rem;
    }
    .guidelines-box {
      font-family: system-ui, "Segoe UI", sans-serif;

      margin: 0 0 0.55rem;

      border-radius: 8px;
      border: 1px solid rgba(227, 184, 106, 0.12);
      background: rgba(227, 184, 106, 0.04);

    .guidelines-box ul { margin: 0.35rem 0 0; padding-left: 1.1rem; }
    .guidelines-box li { margin: 0.2rem 0; }

    .affirm-row input { margin-top: 0.2rem; }
    .not-for-me-wrap {

    }
    .not-for-me-wrap.is-visible { display: block; }
    .not-for-me-wrap .not-for-me-lead {

    }
    .review-more-btn {

    .review-more-btn:hover {

    }

      margin-bottom: 0.3rem;
    }
    .review-share-hint {

    }
    .review-share-hint .muted {

    }
    .catalog-lookup-row {
      display: flex;

      margin: 0.15rem 0 0.5rem;
    }
    button.catalog-lookup-btn {
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: 0.82rem;
      padding: 0.45rem 0.75rem;
      border-radius: 10px;
      border: 1px solid var(--rule);
      background: rgba(227, 184, 106, 0.12);
      color: var(--ink);
      cursor: pointer;
    }
    @media (hover: hover) and (pointer: fine) {
      button.catalog-lookup-btn:hover {
        background: rgba(227, 184, 106, 0.22);
      }
    }
    button.catalog-lookup-btn:disabled {
      opacity: 0.55;
      cursor: not-allowed;
    }
    .catalog-match-box {
      font-family: system-ui, "Segoe UI", sans-serif;
      font-size: 0.82rem;

    .catalog-match-box.is-visible { display: block; }
    .catalog-match-box .match-list {
      margin: 0.45rem 0 0;
      padding: 0;

    }
    .catalog-match-box .match-list button {
      display: block;
      width: 100%;
      text-align: left;
      margin: 0.35rem 0 0;
      padding: 0.45rem 0.55rem;
      border-radius: 8px;
      border: 1px solid var(--rule);
      background: rgba(227, 184, 106, 0.06);
      color: var(--ink);
      cursor: pointer;
      font: inherit;
      font-size: 0.84rem;
      line-height: 1.35;
    }
    @media (hover: hover) and (pointer: fine) {

    }
    .catalog-hint-ok { color: #a8c99a; }

    .bookquest-advanced-prefs {

    }
    .bookquest-advanced-prefs summary {

      align-items: center;
      justify-content: space-between;

      color: var(--dim);

    .bookquest-advanced-prefs summary::-webkit-details-marker { display: none; }

      transition: transform 0.15s ease;

      color: var(--dim);

      margin: 0.5rem 0 0;
      font-size: 0.82rem;
      color: var(--accent);
    }

      opacity: 0.45;
      cursor: not-allowed;
    }

      pointer-events: none;
    }
    .halalit-suggestion-wrap > * { pointer-events: auto; }

<body>
  <div class="halalit-suggestion-wrap" aria-label="Private suggestion to owner">
    <div class="halalit-suggestion-panel" id="halalitSuggestionPanel" hidden>
      <h3>Suggestion for the owner</h3>
      <p>Private—not posted on the site. Sign in to send.</p>
      <textarea id="halalitSuggestionText" maxlength="2000" placeholder="Site idea, book tip, or how Halalit helped…"></textarea>
      <div class="halalit-suggestion-actions">
        <button type="button" id="halalitSuggestionSend">Send</button>
        <button type="button" class="secondary" id="halalitSuggestionClose">Close</button>
      </div>
      <p class="halalit-suggestion-status" id="halalitSuggestionStatus" aria-live="polite"></p>
    </div>
    <button type="button" class="halalit-suggestion-slot" id="halalitSuggestionSlot" aria-label="Send the owner a private suggestion" aria-expanded="false" title="Suggestion box">
      <svg viewBox="0 0 64 72" aria-hidden="true">
        <rect x="8" y="28" width="48" height="38" rx="4" fill="#3d2e22" stroke="#c9a86a" stroke-width="1.5"/>
        <rect x="14" y="22" width="36" height="8" rx="2" fill="#2a2018" stroke="#8a7355" stroke-width="1"/>
        <rect x="22" y="8" width="20" height="18" rx="2" fill="#f4ead6" stroke="#c9a86a" stroke-width="1" transform="rotate(-8 32 17)"/>
        <path d="M26 12h12M25 16h14M27 20h10" stroke="#b8a684" stroke-width="1.2" stroke-linecap="round" opacity="0.55"/>
      </svg>
    </button>
  </div>

    <nav class="top" aria-label="Site">

  <script>
    Promise.all([
      HalalitAccountStorage.ready,
      window.HalalitSiteFlags ? HalalitSiteFlags.ready : Promise.resolve(),
    ]).then(function () {
    (function () {
      if (window.HalalitSiteFlags && !HalalitSiteFlags.isEnabled("bookQuestEnabled")) {
        document.getElementById("root").innerHTML =
          "<p>Book Quest is paused right now. <a href=\"./index.html\">Back to Halalit</a></p>";
        return;
      }

      function accountStore() {
        return window.HalalitAccountStorage || null;
      }

      var READER_MODEL_KEY = "halalitReaderModel";
      var PENDING_REVIEW_KEY = "halalitPendingReview";
      /** Designer bypass: shared logic in halalit-designer-gate.js (?halalitDesigner=…, ?halalitDesigner=off). */
      /** Crowd-sourced titles readers affirmed as Halalit-suitable (local only until a backend exists). */
      var COMMUNITY_TITLES_KEY = "halalitCommunityTitleSubmissions";
      var COMMUNITY_TITLES_CAP = 80;

      function loadCommunityTitles() {
        try {
          var raw = accountStore() ? accountStore().getItem(COMMUNITY_TITLES_KEY) : null;
          if (!raw) return [];
          var arr = JSON.parse(raw);
          return Array.isArray(arr) ? arr : [];
        } catch (e) {
          return [];
        }
      }

      function saveCommunityTitles(list) {
        try {
          if (accountStore()) accountStore().setItem(COMMUNITY_TITLES_KEY, JSON.stringify(list));
        } catch (e) {}
      }

      function normalizeTitleKey(title, author) {
        return (
          String(title || "")
            .toLowerCase()
            .replace(/\s+/g, " ")
            .trim() +
          "|" +
          String(author || "")
            .toLowerCase()
            .replace(/\s+/g, " ")
            .trim()
        );
      }

      function inferCatalogFamilyHint(doc) {
        var Policy = window.HalalitFamilyShelfPolicy;
        if (Policy && typeof Policy.inferCatalogFamilyHint === "function") return Policy.inferCatalogFamilyHint(doc);
        return { tier: "unclear", detail: "Catalog check unavailable—confirm the title fits Halalit’s family shelf rules yourself." };
      }

      function appendCommunityTitle(entry) {
        var list = loadCommunityTitles();
        var key = normalizeTitleKey(entry.titlePlain || entry.title, entry.author);
        for (var i = list.length - 1; i >= 0; i--) {
          if (normalizeTitleKey(list[i].titlePlain || list[i].title, list[i].author) === key) list.splice(i, 1);
        }
        list.push(entry);
        if (list.length > COMMUNITY_TITLES_CAP) list = list.slice(list.length - COMMUNITY_TITLES_CAP);
        saveCommunityTitles(list);
      }

      function buildOpenLibraryQueryUrl(title, author) {
        var params = new URLSearchParams();
        params.set("limit", "6");
        var t = String(title || "").trim();
        var a = String(author || "").trim();
        if (t) params.set("title", t);
        if (a) params.set("author", a);
        if (!t && !a) return null;
        return "https://openlibrary.org/search.json?" + params.toString();
      }

      function defaultReaderModel() {
        return {
          bias: { cautious: 0, bold: 0, social: 0, lone: 0 },
          avoid: {},
          completedRuns: 0,
          /** Times the reader left the end screen for a new quest; reader-note cooldown starts once this is ≥ 1. */
          playthroughsCompleted: 0,
        };
      }

      function loadReaderModel() {
        try {
          var raw = accountStore() ? accountStore().getItem(READER_MODEL_KEY) : null;
          if (!raw) return defaultReaderModel();
          var o = JSON.parse(raw);
          if (!o || typeof o !== "object") return defaultReaderModel();
          o.bias = o.bias || defaultReaderModel().bias;
          o.avoid = o.avoid || {};
          if (!Number.isFinite(o.completedRuns)) o.completedRuns = 0;
          if (!Number.isFinite(o.playthroughsCompleted)) {
            o.playthroughsCompleted = o.completedRuns >= 1 ? Math.max(1, o.completedRuns) : 0;
          }
          return o;
        } catch (e) {
          return defaultReaderModel();
        }
      }

      function saveReaderModel(m) {
        try {
          if (accountStore()) accountStore().setItem(READER_MODEL_KEY, JSON.stringify(m));
        } catch (e) {}
      }

      /** Reader note + “between quests” gate only after the first full quest and “Play again” (second attempt onward). Designer bypass (this browser only) turns the gate off for QA. */
      function readerFeedbackGateEnabled() {
        if (window.HalalitDesignerGate && window.HalalitDesignerGate.designerBypassActive()) return false;
        return (loadReaderModel().playthroughsCompleted || 0) >= 1;
      }

      function bumpPlaythroughsCompleted() {
        var reader = loadReaderModel();
        reader.playthroughsCompleted = (reader.playthroughsCompleted || 0) + 1;
        saveReaderModel(reader);
      }

      function loadPendingReview() {
        try {
          var raw = accountStore() ? accountStore().getItem(PENDING_REVIEW_KEY) : null;
          if (!raw) return null;
          return JSON.parse(raw);
        } catch (e) {
          return null;
        }
      }

      function savePendingReview(obj) {
        try {
          if (!accountStore()) return;
          if (obj == null) accountStore().removeItem(PENDING_REVIEW_KEY);
          else accountStore().setItem(PENDING_REVIEW_KEY, JSON.stringify(obj));
        } catch (e) {}
      }

      /** Checkbox aspects → quiet nudges on the four axes (accumulated across sessions). */
      var ASPECT_BIAS = {
        gentle_pace: { cautious: 1 },
        friendship: { social: 1 },
        humor: { bold: 1, social: 1 },
        animals_or_nature: { lone: 1, cautious: 1 },
        adventure: { bold: 1 },
        wilderness: { lone: 1 },
        puzzles_or_mystery: { bold: 1, social: 1 },
        mythic_or_epic: { bold: 1, lone: 1 },
        teamwork: { social: 1 },
        quiet_voice: { lone: 1, cautious: 1 },
        courage_under_pressure: { bold: 1, cautious: 1 },
      };

      var MISMATCH_BUCKET_NUDGE = {
        cautiousSocial: { bold: 2, lone: 1 },
        boldSocial: { cautious: 2, lone: 1 },
        cautiousLone: { bold: 1, social: 2 },
        boldLone: { cautious: 1, social: 2 },
      };

      function clampBias(m) {
        var keys = ["cautious", "bold", "social", "lone"];
        for (var i = 0; i < keys.length; i++) {
          var k = keys[i];
          var v = m.bias[k];
          if (!Number.isFinite(v)) m.bias[k] = 0;
          else if (v > 8) m.bias[k] = 8;
          else if (v < -6) m.bias[k] = -6;
        }
      }

      function applyAspectsToReader(reader, aspectKeys) {
        if (!aspectKeys || !aspectKeys.length) return;
        for (var i = 0; i < aspectKeys.length; i++) {
          var delta = ASPECT_BIAS[aspectKeys[i]];
          if (!delta) continue;
          for (var k in delta) {
            if (reader.bias[k] != null) reader.bias[k] += delta[k];
          }
        }
        clampBias(reader);
      }

      function applyMismatchToReader(reader, bucket) {
        var n = MISMATCH_BUCKET_NUDGE[bucket];
        if (!n) return;
        for (var k in n) {
          if (reader.bias[k] != null) reader.bias[k] += n[k];
        }
        clampBias(reader);
      }

      /** Inline list of the six reader-chosen shelves (matches `GENRE_CHOICES`). */
      var HALALIT_SIX_SHELF_NAMES =
        "<em>fantasy</em>, <em>science fiction</em>, <em>mystery</em>, <em>realistic fiction</em>, <em>nonfiction</em>, and <em>dystopian</em>";
      var HALALIT_START_GENRE_BEAT =
        "<p>They let a small silence do its work. <q>Before you take the corridor, I’ll ask you to name one of six shelves I keep for readers from all walks of life—" +
        HALALIT_SIX_SHELF_NAMES +
        ". The path of thresholds and tolls stays the same—but the title I press into your hands at the close will belong only to the shelf you choose.</q></p>";
      var HALALIT_RULES_GENRE_BEAT =
        "<p><q>When we finish with rules, I’ll offer those same six by name—" +
        HALALIT_SIX_SHELF_NAMES +
        "—and you’ll pick one. Your recommendation must honor it.</q></p>";

      /**
       * Same story beats, different rooms — which pack you see rotates with the playthrough counter.
       */
      var AREA_PACKS = [
        {
          start: {
            label: "Prologue",
            title: "The lantern room",
            html:
              "<p>The librarian slides a brass lamp toward you. Outside, rain writes thin lines on the glass.</p><p>\"One short quest,\" they say. \"At the end we’ll know what kind of story you actually want to live in next.\"</p>" +
              HALALIT_START_GENRE_BEAT,
          },
          librarianRules: {
            label: "Prologue",
            title: "The lantern room",
            html:
              "<p>The librarian settles back, pleased you asked.</p><p>\"Short version: you’ll cross a threshold, pay a kind of toll, then stand before the shelf that remembers how you moved. Each choice nudges four quiet scores—caution, nerve, company, solitude—so the ending can suggest what sort of book might feel true next. Nothing here can trap you; it only listens.\"</p><p>They tilt the lamp toward the inner door. \"When you’re ready, the corridor is the first real step.\"</p>" +
              HALALIT_RULES_GENRE_BEAT,
          },
          corridor: {
            label: "First threshold",
            title: "A door of many hinges",
            html: "<p>The corridor ends at a door that rattles as if someone is arguing on the other side: a low voice, then a laugh.</p>",
          },
          afterKnockLead:
            "<p>The air here tastes of paper and old varnish—familiar to anyone who has ever waited on a threshold.</p>",
          afterHandleLead:
            "<p>The floorboards remember other feet that chose the quicker way; you feel it through your soles.</p>",
          shelf: {
            default:
              "<p>Beyond the guardian, shelves breathe—dust lifting in slow spirals. One empty slot glows faintly, waiting for a title you haven’t earned yet.</p>",
            story:
              "<p>Beyond the guardian, the shelves seem to lean closer, as if the small truthful thing you offered left a warmth the wood remembers.</p><p>One empty slot glows faintly, waiting for a title you haven’t earned yet.</p>",
            riddle:
              "<p>Beyond the guardian, somewhere high up, chalk squeaks once—someone finishing the riddle you bargained for—and the stacks shiver as if a joke has just landed.</p><p>One empty slot glows faintly, waiting for a title you haven’t earned yet.</p>",
          },
        },
        {
          start: {
            label: "Prologue",
            title: "The map alcove",
            html:
              "<p>You’re shown into a side room where unrolled charts cover a table like overlapping dreams. A small oil lamp hangs over the inkwell.</p><p>\"One short quest,\" the librarian says, tapping the coast of an island that isn’t on any atlas you know. \"Walk it honestly, and we’ll chart what kind of story you actually want next.\"</p>" +
              HALALIT_START_GENRE_BEAT,
          },
          librarianRules: {
            label: "Prologue",
            title: "The map alcove",
            html:
              "<p>They weight a corner of the nearest chart with a smooth stone. \"Rules, then: you’ll cross a threshold, pay a toll in the old way, and stand where the shelves remember your stride. Your choices lean four quiet dials—caution, nerve, company, solitude—so the ending can suggest a book that fits who you were in motion.\"</p><p>They slide a wooden rule aside. \"The corridor beyond this room is the first real line on the map.\"</p>" +
              HALALIT_RULES_GENRE_BEAT,
          },
          corridor: {
            label: "First threshold",
            title: "The compass corridor",
            html:
              "<p>The passage bends once, twice—then straightens toward a door painted with a compass rose so faded you can barely tell north from story.</p><p>From the other side comes the scrape of a chair, then someone humming off-key, as if they’re rehearsing a speech they’ll never give.</p>",
          },
          afterKnockLead:
            "<p>The rose on the door seems to steady, needle-thin, as if your knock gave it a north.</p>",
          afterHandleLead:
            "<p>The compass paint flakes at the latch—your hand arrived before the map agreed.</p>",
          shelf: {
            default:
              "<p>Beyond the guardian, shelves climb like cliffs; wind you cannot feel still lifts dust in spirals. One empty slot glows like a harbor lantern.</p>",
            story:
              "<p>Beyond the guardian, the stacks lean in kindly, as if your small honest story left a tide mark they mean to keep.</p><p>One empty slot glows like a harbor lantern.</p>",
            riddle:
              "<p>Beyond the guardian, chalk skates somewhere overhead, finishing the bargain you made; the wood answers with a chuckle deep in its grain.</p><p>One empty slot glows like a harbor lantern.</p>",
          },
        },
        {
          start: {
            label: "Prologue",
            title: "The winter garden window",
            html:
              "<p>Frost feathers the inside of a tall window; beyond it, a walled garden sleeps under a thin quilt of snow. The librarian sets a lantern on the sill.</p><p>\"One short quest,\" they say, breath fogging the glass for a heartbeat. \"When you return, we’ll know what kind of warmth you’ve been missing in your reading.\"</p>" +
              HALALIT_START_GENRE_BEAT,
          },
          librarianRules: {
            label: "Prologue",
            title: "The winter garden window",
            html:
              "<p>They wipe the glass clear with a cuff. \"Plainly: you’ll cross a threshold, pay a toll, then meet the shelf that remembers how you carried yourself. Each choice tilts four quiet measures—caution, nerve, company, solitude—so the ending can name a book that suits the reader you were along the way.\"</p><p>They nod toward an inner door where draughts slip under like curious cats. \"The corridor waits when you are.\"</p>" +
              HALALIT_RULES_GENRE_BEAT,
          },
          corridor: {
            label: "First threshold",
            title: "The storm door",
            html:
              "<p>The corridor ends at a door banded with iron, cold to the touch. Snowmelt tracks lead toward it—someone came in recently and forgot to dry their boots.</p><p>Behind the wood, a voice counts slowly, as if measuring patience against the weather.</p>",
          },
          afterKnockLead:
            "<p>Your knock rings honest as a handbell; the counting stops mid-number, replaced by the soft shift of someone standing.</p>",
          afterHandleLead:
            "<p>The door gives before the storm in you has quite decided—cold air and lamplight trade places in a rush.</p>",
          shelf: {
            default:
              "<p>Beyond the guardian, rows of spines rise like hedgerows after snow. One empty slot glows with the patient gold of a hearth not lit yet.</p>",
            story:
              "<p>Beyond the guardian, the shelves seem to thaw toward you, as if truth spoken aloud were a kind of heat they recognize.</p><p>One empty slot glows with the patient gold of a hearth not lit yet.</p>",
            riddle:
              "<p>Beyond the guardian, chalk taps once, twice—an answer being finished where you cannot see—and the stacks exhale mist and old paper.</p><p>One empty slot glows with the patient gold of a hearth not lit yet.</p>",
          },
        },
        {
          start: {
            label: "Prologue",
            title: "The bindery niche",
            html:
              "<p>You’re led past humming presses into a quiet niche hung with half-finished covers—leather, cloth, marbled paper curling at the edges. Thread and glue scent the air.</p><p>\"One short quest,\" the librarian murmurs, sliding a slim awl into their sleeve like a bookmark. \"At the end we’ll know which binding fits the story you’re ready to carry.\"</p>" +
              HALALIT_START_GENRE_BEAT,
          },
          librarianRules: {
            label: "Prologue",
            title: "The bindery niche",
            html:
              "<p>They test a corner fold with their thumb. \"Listen: you’ll cross a threshold, pay a toll, then stand where the shelf reads your gait like a signature. Your choices adjust four quiet threads—caution, nerve, company, solitude—so the ending can suggest a book sewn to your measure.\"</p><p>They gesture past the presses. \"The corridor is the spine that leads outward.\"</p>" +
              HALALIT_RULES_GENRE_BEAT,
          },
          corridor: {
            label: "First threshold",
            title: "The stitch-mark door",
            html:
              "<p>The corridor narrows until it frames a door scored with tiny stitch marks, as if someone once sewed it shut and thought better of it.</p><p>From within, you hear the papery whisper of pages being turned too fast for comfort.</p>",
          },
          afterKnockLead:
            "<p>Your knock lands soft as a thimble; the hurried turning stills, thread-taut.</p>",
          afterHandleLead:
            "<p>The latch yields with the sound of a knot slipping—someone’s careful work undone in an instant.</p>",
          shelf: {
            default:
              "<p>Beyond the guardian, shelves stand in neat signatures, each row a different hand. One empty slot glows like gilt catching lamplight.</p>",
            story:
              "<p>Beyond the guardian, the wood seems to remember your small true story the way leather remembers a palm.</p><p>One empty slot glows like gilt catching lamplight.</p>",
            riddle:
              "<p>Beyond the guardian, chalk answers itself somewhere in the stacks, finishing what you started; the shelves tighten like stitches pulled true.</p><p>One empty slot glows like gilt catching lamplight.</p>",
          },
        },
      ];

      function currentAreaPack() {
        var idx = playthroughIndex % AREA_PACKS.length;
        if (idx < 0) idx += AREA_PACKS.length;
        return AREA_PACKS[idx];
      }

      /**
       * Who blocks the way and how the door answers — rotates every playthrough.
       * Toll mechanics stay fixed: same two choices, same “time, truth, or trouble” line.
       */
      var CROSSING_SKINS = [
        {
          crossingLabel: "Crossing",
          crossingTitle: "The velvet keeper",
          afterKnock:
            "<p>You knock—two measured taps, patient and clear.</p>" +
            "<p>On the other side, the voices stop mid-sentence. A latch lifts with a courteous click. Warm lamplight spills across your shoes as the door eases inward on well-oiled hinges. Someone exhales—not quite a laugh, not quite suspicion. You have their attention before anyone has spoken of tolls.</p>",
          afterHandle:
            "<p>The handle turns under your palm. The door swings before you have quite decided whether to commit.</p>" +
            "<p>The half-heard conversation on the other side stops mid-word. Footsteps reach the gap—then stillness, and a single face in the widening light: alert, curious, the way a keeper looks when the story took a shortcut and they mean to hear the next line.</p>",
          guardian: {
            polite:
              "<p>A figure in moth-eaten velvet fills the frame the way a bookmark holds a chapter—deliberate, not cruel. They have been listening since your knock.</p>" +
              "<p>\"Civility first,\" they murmur, as if confirming a rumor they hoped was true. Then their mouth firms. \"Even so: one toll. Time, truth, or trouble—say how you mean to pay.\"</p>",
            bold:
              "<p>A figure in moth-eaten velvet meets you a step inside, already at ease with the quicker way you arrived—as if bold first steps are just another shelf in their catalogue.</p>" +
              "<p>\"You took the short path in,\" they say, without heat. \"Fair enough. One toll—time, truth, or trouble. Name the coin you will spend.\"</p>",
            default:
              "<p>A figure in moth-eaten velvet blocks the way. \"One toll,\" they murmur. \"Time, truth, or trouble.\"</p>",
          },
        },
        {
          crossingLabel: "Crossing",
          crossingTitle: "The ink-steward",
          afterKnock:
            "<p>You knock—wood answering wood with a scholar’s patience.</p>" +
            "<p>The muttering on the other side resolves into a single set of footsteps. The door opens on a sleeve speckled with old ink; the steward blinks as if waking from a sum. Lamplight pools at your feet, polite as a fresh margin.</p>",
          afterHandle:
            "<p>The latch gives with the soft crackle of dried gum. The door swings wide before etiquette catches up.</p>" +
            "<p>An ink-steward stands with a blotter half-raised, hair tied back with twine. Their eyebrows lift—not angry, only astonished that anyone would arrive by draft instead of draftsmanship.</p>",
          guardian: {
            polite:
              "<p>The ink-steward inclines their head, blotter lowered like a white flag. \"You announced yourself properly,\" they say. \"The ledger likes that.\"</p>" +
              "<p>They tap the doorframe once. \"Even so: one toll. Time, truth, or trouble—say how you mean to pay.\"</p>",
            bold:
              "<p>The ink-steward meets you in the doorway, sleeves rolled, chalk dust on one cheek. \"You came in like a blot spreading,\" they say, more amused than scolded.</p>" +
              "<p>\"Fair enough. One toll—time, truth, or trouble. Name the coin you will spend.\"</p>",
            default:
              "<p>An ink-steward blocks the sill, blotter in hand. \"One toll,\" they murmur. \"Time, truth, or trouble.\"</p>",
          },
        },
        {
          crossingLabel: "Crossing",
          crossingTitle: "The night porter",
          afterKnock:
            "<p>You knock—firm, friendly, the way you would at a cousin’s back door.</p>" +
            "<p>A bolt slides; cold air trades places with lamplight. A porter in a patched coat peers out, ring of keys silent at their belt. \"Hush,\" they breathe, as if the building itself were sleeping one room over.</p>",
          afterHandle:
            "<p>The handle turns; hinges complain only once, then remember their manners.</p>" +
            "<p>The porter is already there—how, you cannot say—one hand on a master key, the other raised palm-out in a gesture that means <em>wait, let the draft settle</em>. Snowmelt or rain—whichever the corridor carried—dots their shoulders like punctuation.</p>",
          guardian: {
            polite:
              "<p>The porter’s shoulders ease. \"Good knock,\" they whisper. \"The old place hears courtesy.\"</p>" +
              "<p>They gesture you inward with the key-ring hand. \"Even so: one toll. Time, truth, or trouble—say how you mean to pay.\"</p>",
            bold:
              "<p>The porter exhales through their teeth—not quite a whistle. \"Straight through, are we?\"</p>" +
              "<p>They step aside anyway, boots squeaking once on stone. \"Fair enough. One toll—time, truth, or trouble. Name the coin you will spend.\"</p>",
            default:
              "<p>The night porter fills the doorway, keys at rest. \"One toll,\" they murmur. \"Time, truth, or trouble.\"</p>",
          },
        },
        {
          crossingLabel: "Crossing",
          crossingTitle: "The bridge-sibling",
          afterKnock:
            "<p>You knock; the sound carries like a pebble dropped into a well.</p>" +
            "<p>Two voices had been arguing in gentle overlap—now one laughs, low and kind, and the door opens on a person who might be the librarian’s younger cousin: same patience, different scarf. \"We heard you coming,\" they say, which cannot be true, yet feels true.</p>",
          afterHandle:
            "<p>The door yields; warmth rolls out, smelling of cedar and borrowed coats.</p>" +
            "<p>The person on the other side was mid-gesture, finger raised as if finishing someone else’s sentence. They freeze, grin flickering. \"Shortcut,\" they say lightly. \"My favorite genre.\"</p>",
          guardian: {
            polite:
              "<p>They fold their hands at their belt. \"Polite knocks make polite thresholds,\" they say. \"We keep score of small mercies here.\"</p>" +
              "<p>Their eyes brighten—not teasing, testing. \"Even so: one toll. Time, truth, or trouble—say how you mean to pay.\"</p>",
            bold:
              "<p>They lean on the jamb, unoffended. \"Door-first, story-second—I know the type.\"</p>" +
              "<p>\"Fair enough. One toll—time, truth, or trouble. Name the coin you will spend.\"</p>",
            default:
              "<p>A keeper in a borrowed coat blocks the warm gap. \"One toll,\" they say gently. \"Time, truth, or trouble.\"</p>",
          },
        },
        {
          crossingLabel: "Crossing",
          crossingTitle: "The catalog ghost",
          afterKnock:
            "<p>You knock twice, then once more for luck—the rhythm feels right in this corridor.</p>" +
            "<p>Silence, then paper: a card slid into view at the gap, printed with a single word—<em>Enter</em>—before the door swings. Someone stands just beyond the light, face half in shadow, smile fully present.</p>",
          afterHandle:
            "<p>The latch was never latched; the door admits you like a drawer sliding home.</p>" +
            "<p>A clerkish figure waits with a pencil behind their ear, catalog cards fanned like a hand of patience. \"Fast hooves,\" they murmur, tapping the pencil once against their thumb.</p>",
          guardian: {
            polite:
              "<p>They tuck the pencil away as if honoring a truce. \"You knocked like someone who reads footnotes,\" they say.</p>" +
              "<p>\"Even so: one toll. Time, truth, or trouble—say how you mean to pay.\"</p>",

      function bookQuestGenreMoodPhrase() {

          realistic_fiction: "sunlit window everyday warmth reader at ease calm",
          nonfiction: "globes journals fact shelves gentle studious hush",
          dystopian: "soft cool light hopeful figure quiet resilience no gore",

        var slot = Math.abs(playthroughIndex) % 3;

        return [

          bookQuestPackIndex(),
          (playthroughIndex + (AREA_PACKS.length > 1 ? AREA_PACKS.length - 1 : 1)) % CROSSING_SKINS.length,

      var BOOKQUEST_IMAGE_PIXEL_W = 768;

      function buildBookQuestPollinationsUrl(fullPrompt, seed) {
        var maxLen = 1280;
        var p = String(fullPrompt);
        if (p.length > maxLen) p = p.slice(0, maxLen);
        var path = "https://image.pollinations.ai/prompt/" + encodeURIComponent(p);

          "width=" +
          String(BOOKQUEST_IMAGE_PIXEL_W) +
          "&height=" +
          String(BOOKQUEST_IMAGE_PIXEL_H) +
          "&model=flux&nologo=true&enhance=false&seed=" +
          encodeURIComponent(String(seed));
        return path + "?" + q;
      }

      function commitReaderFeedback(rating, ctx) {
        var reader = loadReaderModel();
        /** Reader finished time with *some* qualifying book; curated signals only when the note is about Halalit’s pick. */
        if (ctx.reviewSource === "own_list") {
          reader.completedRuns += 1;
          saveReaderModel(reader);
          savePendingReview(null);
          if (
            ctx.communityEntry &&
            ctx.communityEntry.titlePlain &&
            ctx.communityEntry.eligibleForRecommendations !== false
          ) {
            appendCommunityTitle(ctx.communityEntry);
          }
          return;
        }
        var aspects = ctx.aspects || [];
        if (rating === "not_for_me") {
          applyMismatchToReader(reader, ctx.bucket);
          reader.avoid[ctx.bookId] = reader.completedRuns + 3;
        } else {
          var keys = [];
          if (rating === "loved" || rating === "liked") keys = aspects.slice();
          else if (rating === "ok" && aspects.length) keys = [aspects[0]];
          applyAspectsToReader(reader, keys);
          if (rating === "loved" && keys.length) applyAspectsToReader(reader, keys);
        }
        reader.completedRuns += 1;
        saveReaderModel(reader);
        savePendingReview(null);
        if (window.HalalitPersonalLibrary && ctx.titlePlain) {
          window.HalalitPersonalLibrary.addFromSuggestedReview({
            titlePlain: ctx.titlePlain,
            bookId: ctx.bookId,
            finishedAt: ctx.finishedAt,
          });
        }
        if (window.HalalitWantToRead && ctx.titlePlain) {
          window.HalalitWantToRead.removeMatching({
            bookId: ctx.bookId,
            titlePlain: ctx.titlePlain,
          });
        }
        if (rating === "not_for_me" && ctx.shelfRuleFeedback && window.HalalitShelfFeedback) {
          window.HalalitShelfFeedback.append(ctx.shelfRuleFeedback);
        }
        if (ctx.reviewFeedback && window.HalalitOwnerFeedback) {
          window.HalalitOwnerFeedback.submitBookQuest(ctx.reviewFeedback);
        }
      }

      function wireReviewForm(root, ctx, onDone) {
        var catalogMeta = { workKey: null, hintTier: null, hintDetail: null, familyPortrayal: null, culturalRepresentation: null };
        function syncOwnPanel() {
          var t = root.querySelector("input[name=\"halalitReviewTarget\"]:checked");
          var panel = root.querySelector("#halalitOwnBookPanel");
          if (!panel) return;
          if (t && t.value === "own_list") panel.classList.add("is-open");
          else panel.classList.remove("is-open");
        }
        function resetCatalogUi() {
          catalogMeta = { workKey: null, hintTier: null, hintDetail: null, familyPortrayal: null, culturalRepresentation: null };
          var box = root.querySelector("#halalitCatalogMatchBox");
          var list = root.querySelector("#halalitCatalogMatchList");
          var lead = root.querySelector("#halalitCatalogMatchLead");
          var st = root.querySelector("#halalitCatalogLookupStatus");
          if (box) {
            box.classList.remove("is-visible");
            if (lead) lead.textContent = "";
            if (list) list.innerHTML = "";
          }
          if (st) st.textContent = "";
        }
        function normalizeOlTitle(doc) {
          var t = doc.title;
          if (Array.isArray(t)) return String(t[0] || "").trim();
          return String(t || "").trim();
        }
        function applyCatalogPick(doc) {
          var titleIn = root.querySelector("#halalitOwnBookTitle");
          var authorIn = root.querySelector("#halalitOwnBookAuthor");
          var ttl = normalizeOlTitle(doc);
          var auth = Array.isArray(doc.author_name) && doc.author_name.length ? doc.author_name.join(", ") : "";
          if (titleIn) titleIn.value = ttl;
          if (authorIn) authorIn.value = auth;
          var hint = inferCatalogFamilyHint(doc);
          catalogMeta.workKey = doc.key || (doc.seed && doc.seed[0]) || null;
          catalogMeta.hintTier = hint.tier;
          catalogMeta.hintDetail = hint.detail;
          catalogMeta.familyPortrayal = hint.familyPortrayal || null;
          catalogMeta.culturalRepresentation = hint.culturalRepresentation || null;
          var box = root.querySelector("#halalitCatalogMatchBox");
          var lead = root.querySelector("#halalitCatalogMatchLead");
          if (box && lead) {
            var cls =
              hint.tier === "verified_clean"
                ? "catalog-hint-ok"
                : hint.tier === "flag_review" || hint.tier === "teen_caution"
                  ? "catalog-hint-warn"
                  : hint.tier === "deity_comfort"
                    ? "catalog-hint-neutral"
                  : hint.tier === "not_verified" || hint.tier === "unclear" || hint.tier === "likely_youth"
                    ? "catalog-hint-neutral"
                    : "";
            var leadHtml =
              "<span class=\"" +
              cls +
              "\">" +
              escapeHtml(hint.detail) +
              "</span>";
            if (hint.familyPortrayal && hint.familyPortrayal.detail) {
              leadHtml +=
                ' <span class="catalog-hint-note"><strong>' +
                escapeHtml(hint.familyPortrayal.label || "Family is portrayed negatively") +
                "</strong> — " +
                escapeHtml(hint.familyPortrayal.detail) +
                "</span>";
            }
            if (
              hint.culturalRepresentation &&
              hint.culturalRepresentation.detail &&
              Policy &&
              typeof Policy.bookQuestAllowsCulturalMisrepresentation === "function" &&
              Policy.bookQuestAllowsCulturalMisrepresentation()
            ) {
              leadHtml +=
                ' <span class="catalog-hint-note"><strong>' +
                escapeHtml(hint.culturalRepresentation.label || "Cultural misrepresentation") +
                "</strong> — " +
                escapeHtml(hint.culturalRepresentation.detail) +
                "</span>";
            }
            if (hint.deityComfort && hint.deityComfort.detail) {
              leadHtml +=
                ' <span class="catalog-hint-note"><strong>' +
                escapeHtml(hint.deityComfort.label || "Deity or mythology (comfort note)") +
                "</strong> — " +
                escapeHtml(hint.deityComfort.detail) +
                "</span>";
            }
            lead.innerHTML =
              leadHtml +
              " <span class=\"muted\">— Open Library match: <strong>" +
              escapeHtml(ttl) +
              "</strong>" +
              (auth ? " · " + escapeHtml(auth) : "") +
              "</span>";
            box.classList.add("is-visible");
            var list = root.querySelector("#halalitCatalogMatchList");
            if (list) list.innerHTML = "";
          }
        }
        root.querySelectorAll("input[name=\"halalitReviewTarget\"]").forEach(function (el) {
          el.addEventListener("change", function () {
            syncOwnPanel();
            resetCatalogUi();
          });
        });
        syncOwnPanel();
        var lookupBtn = root.querySelector("#halalitCatalogLookup");
        if (lookupBtn) {
          lookupBtn.onclick = function () {
            var titleInput = root.querySelector("#halalitOwnBookTitle");
            var authorInput = root.querySelector("#halalitOwnBookAuthor");
            var ownTitle = titleInput ? String(titleInput.value || "").trim() : "";
            var ownAuthor = authorInput ? String(authorInput.value || "").trim() : "";
            var url = buildOpenLibraryQueryUrl(ownTitle, ownAuthor);
            var st = root.querySelector("#halalitCatalogLookupStatus");
            var box = root.querySelector("#halalitCatalogMatchBox");
            var list = root.querySelector("#halalitCatalogMatchList");
            var lead = root.querySelector("#halalitCatalogMatchLead");
            if (!url) {
              window.alert("Type at least a title (or title + author) before looking it up.");
              return;
            }
            lookupBtn.disabled = true;
            if (st) st.textContent = "Searching…";
            resetCatalogUi();
            catalogMeta = { workKey: null, hintTier: null, hintDetail: null, familyPortrayal: null, culturalRepresentation: null };
            fetch(url)
              .then(function (r) {
                if (!r.ok) throw new Error("lookup failed");
                return r.json();
              })
              .then(function (data) {
                var docs = (data && data.docs) || [];
                var pinMsg = null;
                if (window.HalalitCatalogPins && typeof window.HalalitCatalogPins.filterCatalogDocs === "function") {
                  var pinPack = window.HalalitCatalogPins.filterCatalogDocs(docs, ownTitle, ownAuthor);
                  docs = pinPack.docs || docs;
                  if (pinPack.pinned && pinPack.message) pinMsg = pinPack.message;
                }
                lookupBtn.disabled = false;
                if (st) st.textContent = docs.length ? "Pick the closest match:" : "No hits—try a shorter title or a different spelling.";
                if (!docs.length) return;
                if (docs.length === 1) {
                  applyCatalogPick(docs[0]);
                  if (st) st.textContent = pinMsg || "Matched one catalog record.";
                  return;
                }
                if (box && lead && list) {
                  lead.textContent = "Several catalog matches—tap the one you mean:";
                  box.classList.add("is-visible");
                  list.innerHTML = "";
                  for (var i = 0; i < docs.length; i++) {
                    (function (doc) {
                      var li = document.createElement("li");
                      var b = document.createElement("button");
                      b.type = "button";
                      var a = Array.isArray(doc.author_name) && doc.author_name.length ? doc.author_name.join(", ") : "author unknown";
                      b.textContent = (normalizeOlTitle(doc) || "Untitled") + " — " + a;
                      b.onclick = function () {
                        applyCatalogPick(doc);
                      };
                      li.appendChild(b);
                      list.appendChild(li);
                    })(docs[i]);
                  }
                }
              })
              .catch(function () {
                lookupBtn.disabled = false;
                if (st) st.textContent = "Couldn’t reach Open Library—try again later.";
              });
          };
        }
        root.querySelector("#halalitOwnBookTitle") &&
          root.querySelector("#halalitOwnBookTitle").addEventListener("input", function () {
            if (root.querySelector("input[name=\"halalitReviewTarget\"]:checked") && root.querySelector("input[name=\"halalitReviewTarget\"]:checked").value === "own_list") {
              resetCatalogUi();
            }
          });
        root.querySelector("#halalitOwnBookAuthor") &&
          root.querySelector("#halalitOwnBookAuthor").addEventListener("input", function () {
            if (root.querySelector("input[name=\"halalitReviewTarget\"]:checked") && root.querySelector("input[name=\"halalitReviewTarget\"]:checked").value === "own_list") {
              resetCatalogUi();
            }
          });
        var dateBtn = root.querySelector("#halalitFinishedModeDate");
        var yearBtn = root.querySelector("#halalitFinishedModeYear");
        var dateInput = root.querySelector("#halalitFinishedDate");
        var yearInput = root.querySelector("#halalitFinishedYear");
        function setFinishedMode(mode) {
          var dateOn = mode === "date";
          if (dateBtn) dateBtn.setAttribute("aria-pressed", dateOn ? "true" : "false");
          if (yearBtn) yearBtn.setAttribute("aria-pressed", dateOn ? "false" : "true");
          if (dateInput) dateInput.hidden = !dateOn;
          if (yearInput) yearInput.hidden = dateOn;
        }
        if (dateBtn) {
          dateBtn.onclick = function () {
            setFinishedMode("date");
          };
        }
        if (yearBtn) {
          yearBtn.onclick = function () {
            setFinishedMode("year");
          };
        }
        function readFinishedAt() {
          var Lib = window.HalalitPersonalLibrary;
          if (dateInput && !dateInput.hidden && dateInput.value) {
            return Lib ? Lib.normalizeFinishedAt(dateInput.value) : String(dateInput.value);
          }
          if (yearInput && !yearInput.hidden && yearInput.value) {
            return Lib ? Lib.normalizeFinishedAt(yearInput.value) : String(yearInput.value);
          }
          return "";
        }

        function setReviewExpand(btn, body, open) {
          if (!btn || !body) return;
          body.hidden = !open;
          btn.setAttribute("aria-expanded", open ? "true" : "false");
          btn.textContent = open ? "Less" : "More";
        }

        function wireReviewExpand(btn, body) {
          if (!btn || !body) return;
          btn.addEventListener("click", function () {
            setReviewExpand(btn, body, body.hidden);
          });
        }

        function collapseNotForMeExpands() {
          setReviewExpand(
            root.querySelector("#halalitNotForMeMore"),
            root.querySelector("#halalitNotForMeBody"),
            false
          );
          setReviewExpand(
            root.querySelector("#halalitRulesMore"),
            root.querySelector("#halalitRulesDetail"),
            false
          );
        }

        function syncNotForMeWrap() {
          var outEl = root.querySelector("input[name=\"halalitOut\"]:checked");
          var wrap = root.querySelector("#halalitNotForMeWrap");
          if (!wrap) return;
          if (outEl && outEl.value === "not_for_me") {
            wrap.classList.add("is-visible");
            return;
          }
          wrap.classList.remove("is-visible");
          collapseNotForMeExpands();
          syncRulesMoreBlock();
        }

        function syncRulesMoreBlock() {
          var rules = root.querySelector("#halalitWhyRules");
          var block = root.querySelector("#halalitRulesMoreBlock");
          if (!block) return;
          if (rules && rules.checked) {
            block.classList.add("is-visible");
            return;
          }
          block.classList.remove("is-visible");
          setReviewExpand(
            root.querySelector("#halalitRulesMore"),
            root.querySelector("#halalitRulesDetail"),
            false
          );
        }

        function readReviewFeedback(titlePlain, bookId, rating, reviewSource, noteText) {
          if (reviewSource === "own_list") return null;
          var whyRules = root.querySelector("#halalitWhyRules");
          var whyTaste = root.querySelector("#halalitWhyTaste");
          var ruleFlags = [];
          root.querySelectorAll("input[name=\"halalitRuleFlag\"]:checked").forEach(function (el) {
            if (el.value) ruleFlags.push(el.value);
          });
          var doesntMeetRules = !!(whyRules && whyRules.checked) || ruleFlags.length > 0;
          return {
            titlePlain: titlePlain,
            bookId: bookId || "",
            rating: rating,
            reviewSource: reviewSource,
            doesntMeetRules: doesntMeetRules,
            notMyTaste: !!(whyTaste && whyTaste.checked),
            ruleFlags: ruleFlags,
            noteSnippet: noteText || "",
          };
        }

        wireReviewExpand(
          root.querySelector("#halalitNotForMeMore"),
          root.querySelector("#halalitNotForMeBody")
        );
        wireReviewExpand(
          root.querySelector("#halalitRulesMore"),
          root.querySelector("#halalitRulesDetail")
        );
        root.querySelectorAll("input[name=\"halalitOut\"]").forEach(function (el) {
          el.addEventListener("change", syncNotForMeWrap);
        });
        var whyRulesEl = root.querySelector("#halalitWhyRules");
        if (whyRulesEl) whyRulesEl.addEventListener("change", syncRulesMoreBlock);
        root.querySelectorAll("input[name=\"halalitRuleFlag\"]").forEach(function (el) {
          el.addEventListener("change", function () {
            if (!el.checked) return;
            if (whyRulesEl) whyRulesEl.checked = true;
            syncRulesMoreBlock();
          });
        });
        syncNotForMeWrap();

        root.querySelector("#halalitReviewSubmit").onclick = function () {
          var targetEl = root.querySelector("input[name=\"halalitReviewTarget\"]:checked");
          var reviewSource = targetEl && targetEl.value === "own_list" ? "own_list" : "suggested";
          var finishedAt = readFinishedAt();
          var communityEntry = null;
          if (reviewSource === "own_list") {
            var titleInput = root.querySelector("#halalitOwnBookTitle");
            var authorInput = root.querySelector("#halalitOwnBookAuthor");
            var ownTitle = titleInput ? String(titleInput.value || "").trim() : "";
            var ownAuthor = authorInput ? String(authorInput.value || "").trim() : "";
            if (!ownTitle) {
              window.alert("Please type the title of the book from your list that you’re reviewing (add the author if you know it).");
              return;
            }
            var affirm = root.querySelector("#halalitOwnBookAffirm");
            if (!affirm || !affirm.checked) {
              window.alert("Please confirm that your title fits Halalit’s reading standards, or switch back to Halalit’s suggestion.");
              return;
            }
            var Policy = window.HalalitFamilyShelfPolicy;
            if (Policy && typeof Policy.hardExclusionDetailForTitle === "function") {
              var shelfExclusion = Policy.hardExclusionDetailForTitle(ownTitle, ownAuthor);
              if (shelfExclusion) {
                window.alert(shelfExclusion + " Choose Halalit’s suggestion or another title that fits the guidelines.");
                return;
              }
            }
            if (
              Policy &&
              typeof Policy.isEligibleForFamilyShelf === "function" &&
              !Policy.isEligibleForFamilyShelf(ownTitle, ownAuthor, catalogMeta.hintTier, bookQuestShelfOpts(Policy, null))
            ) {
              if (
                Policy &&
                typeof Policy.bookQuestDeityMythologyBlock === "function" &&
                Policy.bookQuestDeityMythologyBlock(ownTitle, ownAuthor) &&
                Policy.bookQuestAllowsDeityMythology &&
                !Policy.bookQuestAllowsDeityMythology()
              ) {
                window.alert(
                  "Halalit would not suggest this title through Book Quest because of deity or mythology in the story—even when the book is otherwise hand-verified clean. Uncheck that exclusion in Advanced recommendations settings on the start screen, or choose another title."
                );
              } else if (catalogMeta.hintTier === "deity_comfort") {
                window.alert(
                  "Halalit would not suggest this title through Book Quest because of deity or mythology in the story—even when the book is otherwise clean. Uncheck that exclusion in Advanced recommendations settings on the start screen, or choose another title."
                );
              } else if (
                Policy &&
                typeof Policy.bookQuestNegativeFamilyPortrayalBlock === "function" &&
                Policy.bookQuestNegativeFamilyPortrayalBlock(ownTitle, ownAuthor) &&
                Policy.bookQuestAllowsFamilyCommunityTone &&
                !Policy.bookQuestAllowsFamilyCommunityTone()
              ) {
                window.alert(
                  "Halalit would not suggest this title through Book Quest because a parent or guardian is cast as unfair or villain-like—not merely annoying family friction. Uncheck that exclusion in Advanced recommendations settings on the start screen, or choose another title."
                );
              } else if (
                Policy &&
                typeof Policy.bookQuestLightRomanceBlock === "function" &&
                Policy.bookQuestLightRomanceBlock(ownTitle, ownAuthor) &&
                Policy.bookQuestAllowsLightRomance &&
                !Policy.bookQuestAllowsLightRomance()
              ) {
                window.alert(
                  "Halalit would not suggest this title through Book Quest because of light romance—crushes, light dating, or similar beats—not adult, dark, or LGBTQ romance. Uncheck that exclusion in Advanced recommendations settings on the start screen, or choose another title."
                );
              } else if (
                Policy &&
                typeof Policy.bookQuestMagicBlock === "function" &&
                Policy.bookQuestMagicBlock(ownTitle, ownAuthor) &&
                Policy.bookQuestAllowsMagic &&
                !Policy.bookQuestAllowsMagic()
              ) {
                window.alert(
                  "Halalit won’t use this pick in Book Quest while magic is turned off in Advanced settings—the book is still hand-verified clean. No magic in your stack? Choose another title, or allow magic on the start screen."
                );
              } else if (
                Policy &&
                typeof Policy.bookQuestSubstanceBlock === "function" &&
                Policy.bookQuestSubstanceBlock(ownTitle, ownAuthor) &&
                Policy.bookQuestAllowsSubstance &&
                !Policy.bookQuestAllowsSubstance()
              ) {
                window.alert(
                  "Halalit would not suggest this title through Book Quest because of alcohol or similar mentions—even when the book is otherwise clean. Think Starry River of the Sky or Ranger's Apprentice level, not addiction arcs like Haymitch. Uncheck that exclusion in Advanced recommendations settings on the start screen, or choose another title."
                );
              } else if (
                Policy &&
                typeof Policy.bookQuestCulturalMisrepresentationBlock === "function" &&
                Policy.bookQuestCulturalMisrepresentationBlock(ownTitle, ownAuthor) &&
                Policy.bookQuestAllowsCulturalMisrepresentation &&
                !Policy.bookQuestAllowsCulturalMisrepresentation()
              ) {
                window.alert(
                  "Halalit would not suggest this title through Book Quest because of cultural misrepresentation in the hand-checked notes—not group demonization. Uncheck that exclusion in Advanced recommendations settings on the start screen, or choose another title."
                );
              } else if (
                Policy &&
                typeof Policy.bookQuestMentalHealthComfortBlock === "function" &&
                Policy.bookQuestMentalHealthComfortBlock(ownTitle, ownAuthor) &&
                Policy.mentalHealthComfortAppliesToReaderBand &&
                Policy.mentalHealthComfortAppliesToReaderBand(
                  Policy.getBookQuestReaderAgeBand ? Policy.getBookQuestReaderAgeBand() : null
                ) &&
                Policy.bookQuestAllowsMentalHealthComfort &&
                !Policy.bookQuestAllowsMentalHealthComfort()
              ) {
                window.alert(
                  "Halalit would not suggest this title through Book Quest because of mental-health weight in the hand-checked notes—for the reader age band you chose. Uncheck that exclusion in Advanced recommendations settings on the start screen, pick Young Child if this title is for a younger reader, or choose another title."
                );
              } else if (
                Policy &&
                typeof Policy.bookQuestMatchesReaderAge === "function" &&
                !Policy.bookQuestMatchesReaderAge(
                  ownTitle,
                  ownAuthor,
                  null,
                  Policy.getBookQuestReaderAgeBand ? Policy.getBookQuestReaderAgeBand() : null
                )
              ) {
                window.alert(
                  "This title is outside the reader age band you chose on the Book Quest start screen. Pick a different book, or start a new quest after choosing a different reader band."
                );
              } else {
                window.alert(
                  "Halalit can’t accept this title for the shared family shelf based on catalog checks or curated notes. Choose Halalit’s suggestion or another title that fits the guidelines."
                );
              }
              return;
            }
            var titlePlain = ownAuthor ? ownTitle + " by " + ownAuthor : ownTitle;
            var noteEl = root.querySelector("#halalitNote");
            var noteText = noteEl ? String(noteEl.value || "").trim().slice(0, 2000) : "";
            var outEl0 = root.querySelector("input[name=\"halalitOut\"]:checked");
            var rating0 = outEl0 ? outEl0.value : "liked";
            var storeTier =
              catalogMeta.hintTier === "flag_review"
                ? "catalog_flagged"
                : catalogMeta.hintTier === "verified_clean"
                  ? "catalog_verified_clean"
                  : "affirmed_reader_only";
            communityEntry = {
              title: ownTitle,
              author: ownAuthor,
              titlePlain: titlePlain,
              rating: rating0,
              noteSnippet: noteText,
              openLibraryKey: catalogMeta.workKey,
              catalogFamilyTier: catalogMeta.hintTier,
              catalogFamilyDetail: catalogMeta.hintDetail,
              storedAs: storeTier,
              readerGenreAtSave: readerGenre,
              submittedAt: new Date().toISOString(),
              finishedAt: finishedAt || null,
              eligibleForRecommendations:
                catalogMeta.hintTier !== "flag_review" &&
                catalogMeta.hintTier !== "fanservice_caution" &&
                (catalogMeta.hintTier !== "deity_comfort" ||
                  (Policy &&
                    typeof Policy.bookQuestAllowsDeityMythology === "function" &&
                    Policy.bookQuestAllowsDeityMythology())) &&
                (!Policy ||
                  typeof Policy.isEligibleForFamilyShelf !== "function" ||
                  Policy.isEligibleForFamilyShelf(
                    ownTitle,
                    ownAuthor,
                    catalogMeta.hintTier,
                    bookQuestShelfOpts(Policy, null)
                  )),
            };
          }
          var outEl = root.querySelector("input[name=\"halalitOut\"]:checked");
          var rating = outEl ? outEl.value : "liked";
          var noteEl = root.querySelector("#halalitNote");
          var noteText = noteEl ? String(noteEl.value || "").trim().slice(0, 2000) : "";
          var feedbackTitle =
            reviewSource === "own_list" && communityEntry
              ? communityEntry.titlePlain
              : ctx.titlePlain;
          var reviewFeedback = readReviewFeedback(
            feedbackTitle,
            ctx.bookId,
            rating,
            reviewSource,
            noteText
          );
          var extended = Object.assign({}, ctx, {
            reviewSource: reviewSource,
            communityEntry: communityEntry,
            finishedAt: finishedAt,
            reviewFeedback: reviewFeedback,
            shelfRuleFeedback: rating === "not_for_me" ? reviewFeedback : null,
          });
          commitReaderFeedback(rating, extended);
          if (typeof onDone === "function") onDone();
        };
      }

      function renderPendingGate(pending) {
        var labelEl = document.getElementById("sceneLabel");
        var titleEl = document.getElementById("title");
        var root = document.getElementById("root");
        labelEl.textContent = "Between quests";
        titleEl.textContent = "Reader note";
        var ctx = {
          bookId: pending.bookId,
          titlePlain: pending.titlePlain,
          bucket: pending.bucket,
          aspects: pending.aspects,
          gate: true,
        };
        root.innerHTML = withSceneVisual("pendingGate", reviewSectionHtml(ctx));
        wireReviewForm(root, ctx, function () {
          initGame();
        });
      }

      function render() {
        const node = nodes[nodeId];
        const labelEl = document.getElementById("sceneLabel");
        const titleEl = document.getElementById("title");
        const root = document.getElementById("root");
        var pack = currentAreaPack();
        var cross = currentCrossingSkin();

        if (nodeId === "start") {
          labelEl.textContent = pack.start.label;
          titleEl.textContent = pack.start.title;
        } else if (nodeId === "librarianRules") {
          labelEl.textContent = pack.librarianRules.label;
          titleEl.textContent = pack.librarianRules.title;
        } else if (nodeId === "genreChoice") {
          labelEl.textContent = node.label;
          titleEl.textContent = node.title;
        } else if (
          nodeId === "nonfictionField" ||
          nodeId === "nonfictionNatureWalk" ||
          nodeId === "nonfictionCookbookStart" ||
          nodeId === "nonfictionArtStart" ||
          nodeId === "nonfictionShelf"
        ) {
          labelEl.textContent = nodes[nodeId].label;
          titleEl.textContent = nodes[nodeId].title;
        } else if (nodeId === "corridor") {
          labelEl.textContent = pack.corridor.label;
          titleEl.textContent = pack.corridor.title;
        } else if (nodeId === "guardian" || nodeId === "riddleToll") {
          labelEl.textContent = cross.crossingLabel || node.label;
          titleEl.textContent = cross.crossingTitle || node.title;
        } else {
          labelEl.textContent = node.label;
          titleEl.textContent = node.title;
        }

        if (nodeId === "end") {
          const rec = recommendation();
          enqueueQuestSuggestionToWantToRead(rec);
          var gateOn = readerFeedbackGateEnabled();
          if (gateOn && !endReviewSubmitted) {
            savePendingReview({
              bookId: rec.bookId,
              titlePlain: rec.titlePlain,
              bucket: rec.bucket,
              aspects: rec.aspects,
            });
            var ctx = {
              bookId: rec.bookId,
              titlePlain: rec.titlePlain,
              bucket: rec.bucket,
              aspects: rec.aspects,
              gate: false,
            };
            root.innerHTML = withSceneVisual(
              "end",
              "<p>" +
                rec.line +
                "</p>" +
                "<p class=\"end-book\">" +
                rec.pick +
                "</p>" +
                "<p class=\"muted\">Already reading something else from your own want-to-read pile? You can still leave your note on <em>that</em> title below, if it meets the same family shelf rules—Halalit doesn’t need you to switch books midstream.</p>" +
                "<p class=\"muted\">This web build is a tiny stand-in for the fuller Halalit prototype—your choices here are only a sketch of the real game’s signals. Named titles are hand-picked for family-friendly shelves.</p>" +
                reviewSectionHtml(ctx) +
                "<p class=\"restart\"><button type=\"button\" id=\"again\" disabled>Play again</button> <span class=\"muted\" id=\"againHint\">(unlocks after you save your reader note)</span></p>"
            );
            wireReviewForm(root, ctx, function () {
              endReviewSubmitted = true;
              render();
            });
            attachQuestCoverThumb(root, rec.titlePlain);
          } else if (gateOn && endReviewSubmitted) {
            root.innerHTML = withSceneVisual(
              "end",
              "<p>" +
                rec.line +
                "</p>" +
                "<p class=\"end-book\">" +
                rec.pick +
                "</p>" +
                "<p class=\"muted\">Your note is saved—about Halalit’s pick or the title you named from your own list. The shelf will weigh it the next time it offers a title.</p>" +
                "<p class=\"muted\">Affirmed “own list” titles that pass the automatic catalog family check are saved to your account for Halalit’s curated recommendation pool.</p>" +
                "<p class=\"restart\"><button type=\"button\" id=\"again\">Play again</button></p>"
            );
            document.getElementById("again").onclick = function () {
              bumpPlaythroughsCompleted();
              resetRunState();
              playthroughIndex = bumpPlaythroughIndex();
              render();
            };
            attachQuestCoverThumb(root, rec.titlePlain);
          } else {
            if (!endReviewSubmitted) {
              var ctxFirst = {
                bookId: rec.bookId,
                titlePlain: rec.titlePlain,
                bucket: rec.bucket,
                aspects: rec.aspects,
                gate: false,
                submitReviewLabel: "Save my reader note",
              };
              root.innerHTML = withSceneVisual(
                "end",
                "<p>" +
                  rec.line +
                  "</p>" +
                  "<p class=\"end-book\">" +
                  rec.pick +
                  "</p>" +
                  "<p class=\"muted\">Already reading something else? Name that title below, optionally look it up in Open Library for catalog age hints, and save a note—optional on this first full run. Titles you affirm as Halalit-suitable are saved to your account.</p>" +
                  "<p class=\"muted\">This web build is a tiny stand-in for the fuller Halalit prototype—your choices here are only a sketch of the real game’s signals. Named titles are hand-picked for family-friendly shelves.</p>" +
                  "<p class=\"muted\">From your next full quest onward, the shelf will ask for a short reader note before it unlocks another round—so suggestions can lean with you.</p>" +
                  reviewSectionHtml(ctxFirst) +
                  "<p class=\"restart\"><button type=\"button\" id=\"again\">Play again</button> <span class=\"muted\" id=\"againHint\">(reader note optional this round)</span></p>"
              );
              wireReviewForm(root, ctxFirst, function () {
                endReviewSubmitted = true;
                render();
              });
              document.getElementById("again").onclick = function () {
                bumpPlaythroughsCompleted();
                resetRunState();
                playthroughIndex = bumpPlaythroughIndex();
                render();
              };
              attachQuestCoverThumb(root, rec.titlePlain);
            } else {
              root.innerHTML = withSceneVisual(
                "end",
                "<p>" +
                  rec.line +
                  "</p>" +
                  "<p class=\"end-book\">" +
                  rec.pick +
                  "</p>" +
                  "<p class=\"muted\">Your note is saved—about Halalit’s pick or the title you named from your own list.</p>" +
                  "<p class=\"muted\">This web build is a tiny stand-in for the fuller Halalit prototype—your choices here are only a sketch of the real game’s signals. Named titles are hand-picked for family-friendly shelves.</p>" +
                  "<p class=\"muted\">From your next full quest onward, the shelf will ask for a short reader note before it unlocks another round—so suggestions can lean with you.</p>" +
                  "<p class=\"restart\"><button type=\"button\" id=\"again\">Play again</button></p>"
              );
              document.getElementById("again").onclick = function () {
                bumpPlaythroughsCompleted();
                resetRunState();
                playthroughIndex = bumpPlaythroughIndex();
                render();
              };
              attachQuestCoverThumb(root, rec.titlePlain);
            }
          }
          return;
        }

        var bodyHtml = node.html;
        if (nodeId === "start") {
          bodyHtml = pack.start.html;
          bodyHtml +=
            "<p class=\"muted\">A scrap by the lantern lists a riddle—you needn’t solve it unless you bargain for one later. <em>" +
            currentRiddleRound().prompt +
            "</em></p>" +
            bookQuestReaderAgeHtml() +
            bookQuestPrefRowsHtml();
        } else if (nodeId === "librarianRules") {
          bodyHtml = pack.librarianRules.html;
        } else if (nodeId === "corridor") {
          bodyHtml = pack.corridor.html;
        } else if (nodeId === "genreChoice") {
          bodyHtml = genreChoiceHtml();
        } else if (nodeId === "nonfictionShelf") {
          bodyHtml = nonfictionShelfHtml();
        } else if (nodeId === "afterKnock") {
          bodyHtml = (pack.afterKnockLead || "") + (cross.afterKnock || node.html);
        } else if (nodeId === "afterHandle") {
          bodyHtml = (pack.afterHandleLead || "") + (cross.afterHandle || node.html);
        }
        if (nodeId === "guardian") bodyHtml = guardianHtml();
        if (nodeId === "riddleToll") bodyHtml = riddleTollHtml();
        if (nodeId === "shelf") bodyHtml = shelfHtml();

        var choiceList =
          nodeId === "riddleToll" ? riddleChoicesForRender() : nodeId === "genreChoice" ? GENRE_CHOICES : node.choices;

        let html = sceneImageFigureHtml(nodeId) + bodyHtml + "<div class=\"choices\">";
        choiceList.forEach(function (ch, i) {
          html += "<button type=\"button\" class=\"choice\" data-i=\"" + i + "\">" + ch.text + "</button>";
        });
        html += "</div>";
        root.innerHTML = html;
        if (nodeId === "start") {
          wireBookQuestReaderAge(root);
          wireBookQuestPrefs(root);
        }
        root.querySelectorAll("button.choice").forEach(function (btn) {
          btn.onclick = function () {
            const i = Number(btn.getAttribute("data-i"));
            const ch = choiceList[i];
            if (ch.askHint) {
              var hintArr = riddleHintsForRound();
              if (riddleHintLevel === 0) applyScores({ cautious: 2 });
              else if (riddleHintLevel < hintArr.length) applyScores({ cautious: 1 });
              if (riddleHintLevel < hintArr.length) riddleHintLevel += 1;
              render();
              return;
            }
            applyScores(ch.scores);
            if (ch.genreId) readerGenre = ch.genreId;
            if (ch.nonfictionTrack) nonfictionTrack = ch.nonfictionTrack;
            if (ch.doorManner) doorManner = ch.doorManner;
            if (ch.tollKind) tollKind = ch.tollKind;
            if (nodeId === "riddleToll" && ch.next === "shelf") riddleHintLevel = 0;
            nodeId = ch.next;
            render();
          };
        });
      }

      function initGame() {
        resetRunState();
        playthroughIndex = bumpPlaythroughIndex();
        render();
      }

      if (window.HalalitDesignerGate) window.HalalitDesignerGate.applyDesignerUrlParamOnce();
      var pendingLoad = loadPendingReview();
      if (pendingLoad && !readerFeedbackGateEnabled()) {
        savePendingReview(null);
        pendingLoad = null;
      }
      if (pendingLoad) {
        renderPendingGate(pendingLoad);
      } else {
        initGame();
      }
    })();
    });
  </script>
</body>
</html>
