# Odd Trove — nginx on the VPS (Certbot TLS on oddtrove.art).
# Public: / (hub), /halalit/, /crocheter/. Owner paths: hub cookie only (no browser login popup).
# Backend Python servers should bind 127.0.0.1 only (see deploy-kids-sites.sh).
#
# Install: scp to /etc/nginx/sites-available/oddtrove.art, nginx -t, reload.
# Owner password: bash top/scripts/setup-oddtrove-owner-auth.sh

server {
    listen 443 ssl;
    server_name www.oddtrove.art;
    ssl_certificate /etc/letsencrypt/live/oddtrove.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oddtrove.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://oddtrove.art$request_uri;
}

server {
    server_name oddtrove.art;

    location /halalit/api/ {
        proxy_pass http://127.0.0.1:8075/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 8m;
    }

    location /halalit/ {
        proxy_pass https://127.0.0.1:8074/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /hub/api/ {
        proxy_pass http://127.0.0.1:8077/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /hub/api/owner-check {
        internal;
        proxy_pass http://127.0.0.1:8077/owner-check;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Cookie $http_cookie;
    }

    location /maestros/ {
        auth_request /hub/api/owner-check;
        error_page 401 = @owner_login_redirect;
        proxy_pass https://127.0.0.1:8071/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /envdyst/ {
        auth_request /hub/api/owner-check;
        error_page 401 = @owner_login_redirect;
        proxy_pass https://127.0.0.1:8072/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /crocheter/api/ {
        proxy_pass http://127.0.0.1:8076/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 4m;
    }

    location /crocheter/ {
        proxy_pass https://127.0.0.1:8073/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /bane {
        return 301 /climatic-mysteries/;
    }

    location ^~ /bane/ {
        rewrite ^/bane/(.*)$ /climatic-mysteries/$1 permanent;
    }

    location /climatic-mysteries/ {
        auth_request /hub/api/owner-check;
        error_page 401 = @owner_login_redirect;
        proxy_pass https://127.0.0.1:8060/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = / {
        proxy_pass https://127.0.0.1:8070/;
        proxy_ssl_verify off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        return 404;
    }

    location @owner_login_redirect {
        return 302 https://oddtrove.art/?owner=1;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/oddtrove.art/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/oddtrove.art/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    listen 80;
    server_name oddtrove.art www.oddtrove.art;
    return 301 https://oddtrove.art$request_uri;
}
